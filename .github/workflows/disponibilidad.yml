name: Actualizar disponibilidad

# Guarda cada 20 minutos la disponibilidad de GO CARS como archivo estático en el
# propio dominio (datos/disponibilidad.json). Así el catálogo muestra las horas aunque
# la red del visitante no pueda llegar a Google (IPv6 roto, bloqueadores, etc.).
#
# En repositorios públicos los minutos de Actions son gratis.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disponibilidad
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar la disponibilidad de los próximos 15 días
        run: python3 datos/actualizar_disponibilidad.py

      - name: Publicar si hubo cambios
        run: |
          git config user.name  "GO CARS disponibilidad"
          git config user.email "gocarspensilvania@gmail.com"
          git add datos/disponibilidad.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Disponibilidad actualizada $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
